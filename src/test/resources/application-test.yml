spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

# Disable scheduler in tests — triggered manually
reminder:
  scheduler:
    enabled: false
    poll-interval-ms: 60000
    batch-size: 100
    max-retry-count: 3

logging:
  level:
    com.appointment: DEBUG
